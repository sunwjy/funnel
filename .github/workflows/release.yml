name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT so that pushes/PRs from the changesets action trigger CI
          # (events from the default GITHUB_TOKEN never trigger other workflows).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 22 bundles npm 10.x).
      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # `pnpm version` is a pnpm builtin that shadows the package.json script;
          # `pnpm run` is required to invoke the scripts.
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
